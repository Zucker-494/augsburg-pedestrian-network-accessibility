name: Build Project03 GIS Analysis

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-project03:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Augsburg OSM inputs
        run: |
          python src/00_download_inputs.py

      - name: Run complete GIS pipeline
        run: |
          python src/run_project03.py

      - name: Show generated summary
        run: |
          cat outputs/RESULTS_SUMMARY.md

      - name: Remove large working files
        run: |
          rm -f data/raw/augsburg_pedestrian_network.osm
          rm -f data/raw/augsburg_boundary.geojson
          rm -rf data/processed/*
          touch data/processed/.gitkeep

      - name: Commit generated portfolio outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs docs
          git add -f data/processed/.gitkeep
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Build Project03 network accessibility outputs"
            git push
          fi

      - name: Upload complete outputs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: project03-network-accessibility-outputs
          path: |
            outputs/
            docs/
          retention-days: 30
